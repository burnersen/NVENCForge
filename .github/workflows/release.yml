# Turns a pushed version tag into a finished release: builds the exe exactly
# the way the released exes have always been built, then publishes it as the
# release asset. Runs on Windows for the same reason CI does - every source
# file carries //go:build windows && amd64, so a Linux runner finds no
# packages at all and would report success without building anything.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a tag that was pushed before this workflow existed still be released,
  # and gives a failed run a second attempt without having to move the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v1.25.0)'
        required: true

# The default token is read-only; publishing a release and uploading its asset
# both need write access to the repository contents.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The annotated tag message becomes the release notes, and that
          # annotation only exists in a clone that carries the tag objects.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # Deliberately NOT go-version-file: the "go 1.22" line in go.mod is
          # the oldest toolchain the sources compile with, not the one a
          # release should ship. Following it would hand users binaries built
          # by a Go that no longer gets security fixes - and this program
          # fetches its FFmpeg over HTTPS, so that TLS stack matters.
          go-version: 'stable'
          cache: true

      # A tag that disagrees with appVersion would ship an exe announcing the
      # wrong version in its own startup header. Cheaper to catch here than to
      # replace a published asset afterwards.
      - name: Tag matches appVersion
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $match = Select-String -Path main.go -Pattern '^const appVersion = "(.+)"' | Select-Object -First 1
          if (-not $match) {
            Write-Host "::error::Could not find appVersion in main.go"
            exit 1
          }
          $inCode = $match.Matches[0].Groups[1].Value
          if ("v$inCode" -ne $tag) {
            Write-Host "::error::Tag $tag does not match appVersion $inCode in main.go"
            exit 1
          }
          Write-Host "Tag $tag matches appVersion $inCode."

      - name: go test
        run: go test ./...

      # -ldflags="-s -w" drops the debug and symbol tables: the same flags
      # every released exe so far was built with, so the asset stays the size
      # users are used to.
      - name: Build
        run: go build -ldflags="-s -w" -o NVENCForge.exe .

      # gh is preinstalled on GitHub runners and signs in with the token this
      # workflow already holds, so no personal access token is involved.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $title = "NVENCForge $tag"
          Write-Host "Publishing $tag with NVENCForge.exe ($((Get-Item NVENCForge.exe).Length) bytes)."

          # The release text is the annotated tag message - one source, written
          # once, at the moment the version is cut. A tag without one is a
          # mistake worth stopping for, not something to paper over with an
          # empty release.
          $notes = (git tag -l --format='%(contents)' $tag) -join "`n"
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Host "::error::Tag $tag has no annotation - the release notes come from it. Create it with 'git tag -a'."
            exit 1
          }
          $notes | Out-File -FilePath release-notes.md -Encoding utf8

          # gh release view exits non-zero when the release does not exist yet.
          # Re-running a release (a corrected workflow, a retried build) has to
          # refresh what is there instead of failing on the second attempt.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # --draft=false is not cosmetic: deleting a tag turns its release
            # into a draft, and a draft is invisible to everyone but the owner.
            # A rerun therefore has to publish it again, or the release quietly
            # disappears from the releases page.
            Write-Host "Release $tag already exists - refreshing its notes and asset."
            gh release edit $tag --title $title --notes-file release-notes.md --draft=false
            gh release upload $tag NVENCForge.exe --clobber
          } else {
            gh release create $tag NVENCForge.exe --title $title --notes-file release-notes.md
          }
